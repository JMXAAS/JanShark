[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "janshark"
version = "0.1.0"
description = "Reengineered Tableau Server Logshark using DuckDB and a zero-server static HTML/DuckDB-WASM dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
]

[project.scripts]
janshark = "janshark.cli:main"

